<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f2ea" />
  <title>墨屿 · 小说创作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">墨</span><div><strong>墨屿</strong><small>小说创作台</small></div></div>
      <div class="top-actions"><span id="saveState" class="save-state">本地已保存</span><button class="icon-btn" id="finalCheckBtn" title="终稿检查" aria-label="终稿检查">✓</button><button class="icon-btn" id="markdownExportBtn" title="导出 Markdown" aria-label="导出 Markdown">MD</button><button class="icon-btn" id="epubExportBtn" title="导出 EPUB" aria-label="导出 EPUB">EPUB</button><button class="icon-btn" id="importBtn" title="导入 JSON" aria-label="导入 JSON">↓</button><button class="icon-btn" id="exportBtn" title="导出 JSON" aria-label="导出 JSON">↑</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="project-card"><span class="eyebrow">当前作品</span><h1 id="projectTitle">未命名长篇</h1><p id="projectMeta">0 章 · 0 字</p><button class="ghost-btn" id="editProjectBtn">编辑作品信息</button></div>
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-view="dashboard"><span>⌂</span>总览</button>
          <button class="nav-item" data-view="editor"><span>✦</span>章节 + AI 写作</button>
          <button class="nav-item" data-view="world"><span>♧</span>设定库</button>
          <button class="nav-item" data-view="memory"><span>✦</span>记忆中枢</button>
          <button class="nav-item" data-view="plot"><span>◇</span>情节与伏笔</button>
          <button class="nav-item" data-view="story"><span>⌘</span>故事结构</button>
          <button class="nav-item" data-view="search"><span>⌕</span>全文搜索</button>
        </nav>
        <div class="sidebar-foot"><span class="status-dot"></span>SQLite 本地保存<div class="shortcut">⌘ K 搜索</div></div>
      </aside>
      <main id="main" class="main"></main>
    </div>
  </div>
  <input id="fileInput" type="file" accept="application/json" hidden />
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
