name: 墨屿检查

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          python -m py_compile *.py scripts/*.py tests/*.py
          for source in *.js scripts/*.cjs tests/*.cjs; do
            node --check "$source"
          done
      - name: Contract fixtures
        run: |
          set -e
          for fixture in tests/*_fixtures.py; do
            echo "== $fixture"
            python "$fixture"
          done
      - name: Evaluation fixtures
        run: python scripts/evaluation_runner.py --fixtures-dir tests/fixtures --output /tmp/moyu-evaluation.json
      - name: Editor merge regressions
        run: node tests/editor_sync_fixtures.cjs
      - name: Install browser regression runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/moyu-browser-runtime" --no-audit --no-fund --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/moyu-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/frontend_browser_regressions.cjs
      - name: Search browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/search_browser_regressions.cjs
      - name: Planning browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/planning_browser_regressions.cjs
      - name: Model settings browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/model_settings_browser_regressions.cjs
      - name: Five chapter author flow
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/desktop_author_flow_regressions.cjs
      - name: Instruction draft browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/instruction_draft_browser_regressions.cjs
      - name: Reference passage browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/reference_passages_browser_regressions.cjs
      - name: Author lifecycle browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/author_workspace_lifecycle_browser_regressions.cjs
      - name: Export override browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/export_override_browser_regressions.cjs
      - name: Material dependency browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/material_dependency_browser_regressions.cjs
      - name: Analysis guidance browser regressions
        env:
          MOYU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/moyu-browser-runtime/node_modules/playwright
          MOYU_TEST_PYTHON: python
        run: node tests/analysis_guidance_browser_regressions.cjs
