name: 墨屿桌面安装包

on:
  workflow_dispatch:
  push:
    branches:
      - codex/desktop-installers
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
            backend: build/backend/moyu-service/moyu-service
            executable: dist/mac-arm64/墨屿.app/Contents/MacOS/墨屿
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: macos-x64
            backend: build/backend/moyu-service/moyu-service
            executable: dist/mac/墨屿.app/Contents/MacOS/墨屿
          - name: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
            backend: build/backend/moyu-service/moyu-service.exe
            executable: dist/win-unpacked/墨屿.exe
    env:
      PYTHONUTF8: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) { console.error("Release tag must match package.json version"); process.exit(1); }'
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r desktop/requirements-build.txt
      - name: Check desktop runtime boundaries
        run: node --test tests/desktop_runtime.test.cjs
      - name: Build native installer and archive
        run: python scripts/build_desktop.py --arch ${{ matrix.arch }}
      - name: Verify bundled backend
        run: python tests/desktop_backend_fixtures.py --backend "${{ matrix.backend }}"
      - name: Verify real desktop application
        run: node tests/desktop_smoke.cjs --executable "${{ matrix.executable }}"
      - name: Verify macOS installation from disk image
        if: matrix.platform == 'mac'
        timeout-minutes: 15
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          dmg = Path("dist") / f"Moyu-{version}-mac-{os.environ['BUILD_ARCH']}.dmg"
          subprocess.run(
              [sys.executable, "-B", "tests/macos_installer_smoke.py", "--dmg", str(dmg)],
              check=True,
          )
      - name: Verify Windows installation and uninstallation
        if: matrix.platform == 'win'
        timeout-minutes: 20
        shell: pwsh
        run: ./tests/windows_installer_smoke.ps1
      - name: Check installer inventory and create checksums
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_ARTIFACT: ${{ matrix.artifact }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          stem = f"Moyu-{version}-{os.environ['BUILD_PLATFORM']}-{os.environ['BUILD_ARCH']}"
          extensions = ("dmg", "zip") if os.environ["BUILD_PLATFORM"] == "mac" else ("exe", "zip")
          expected = {f"{stem}.{extension}" for extension in extensions}
          actual = {item.name for item in Path("dist").iterdir() if item.suffix in {".dmg", ".exe", ".zip"}}
          if actual != expected:
              raise SystemExit(f"Unexpected installer inventory: {sorted(actual)}")
          checksums = []
          for name in sorted(expected):
              with (Path("dist") / name).open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              checksums.append(f"{digest}  {name}\n")
          output = Path("dist") / f"SHA256SUMS-{os.environ['BUILD_ARTIFACT']}.txt"
          output.write_text("".join(checksums), encoding="utf-8", newline="\n")
      - name: Upload verified installers
        uses: actions/upload-artifact@v7
        with:
          name: moyu-desktop-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-${{ matrix.artifact }}.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v8
        with:
          pattern: moyu-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release inventory and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          root = Path("release-assets")
          expected = set()
          for artifact, platform, arch, extensions in (
              ("macos-arm64", "mac", "arm64", ("dmg", "zip")),
              ("macos-x64", "mac", "x64", ("dmg", "zip")),
              ("windows-x64", "win", "x64", ("exe", "zip")),
          ):
              checksum_name = f"SHA256SUMS-{artifact}.txt"
              expected.add(checksum_name)
              names = {f"Moyu-{version}-{platform}-{arch}.{extension}" for extension in extensions}
              expected.update(names)
              lines = (root / checksum_name).read_text(encoding="utf-8").splitlines()
              recorded = {}
              for line in lines:
                  digest, name = line.split("  ", 1)
                  if name not in names or name in recorded:
                      raise SystemExit("Unexpected checksum entry")
                  recorded[name] = digest
              if set(recorded) != names:
                  raise SystemExit("Missing installer checksum")
              for name, digest in recorded.items():
                  with (root / name).open("rb") as stream:
                      actual = hashlib.file_digest(stream, "sha256").hexdigest()
                  if actual != digest:
                      raise SystemExit(f"Installer checksum mismatch: {name}")
          if {item.name for item in root.iterdir()} != expected:
              raise SystemExit("Release inventory must contain exactly six installers and three checksum files")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
            --title "墨屿 $RELEASE_TAG" \
            --notes "包含 Mac Apple Silicon、Mac Intel 和 Windows x64 安装包及 SHA256 校验文件。所有平台构建、内置服务和真实桌面窗口检查均通过后才发布。本版未使用发行者签名，macOS 未经 Apple 公证；安装与数据说明见仓库 docs/desktop-packaging.md。"
