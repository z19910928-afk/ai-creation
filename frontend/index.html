<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f6f7" />
  <link rel="icon" href="data:," />
  <title>墨屿 · 小说创作台</title>
  <link rel="stylesheet" href="styles.css?v=20261024-budget-toggle-v013" />
  <link rel="stylesheet" href="knowledge-workspace.css?v=20261018-model-config-v012" />
  <link rel="stylesheet" href="editor-preferences.css?v=20261018-model-config-v012" />
  <link rel="stylesheet" href="agent-chat.css?v=20261018-model-config-v012" />
  <link rel="stylesheet" href="agent-settings.css?v=20261018-model-config-v012" />
  <link rel="stylesheet" href="model-picker.css?v=20261018-model-config-v012" />
  <link rel="stylesheet" href="consistency-panel.css?v=20261023-consistency-v1" />
  <link rel="stylesheet" href="prompt-workshop.css?v=20261023-prompts-v2" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">墨</span><div><strong>墨屿</strong><small>小说创作台</small></div></div>
      <div class="top-actions">
        <button id="saveState" class="save-state" title="查看保存状态">正在连接本机…</button>
        <button type="button" class="ghost-btn top-action-btn" id="finalCheckBtn" title="终稿检查">终稿检查</button>
        <button type="button" class="ghost-btn top-action-btn" id="markdownExportBtn" title="导出文稿">导出文稿</button>
        <button type="button" class="ghost-btn top-action-btn" id="epubExportBtn" title="导出电子书">导出电子书</button>
        <button type="button" class="ghost-btn top-action-btn" id="importBtn" title="导入稿件包">导入稿件包</button>
        <button type="button" class="ghost-btn top-action-btn" id="exportBtn" title="导出稿件包">导出稿件包</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div class="project-card"><span class="eyebrow">当前作品</span><h1 id="projectTitle">未命名长篇</h1><p id="projectMeta">0 章 · 0 字</p><button class="ghost-btn" id="editProjectBtn">编辑作品信息</button></div>
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item active" data-view="dashboard"><span>⌂</span>总览</button>
          <button class="nav-item" data-view="library"><span>▤</span>作品书架</button>
          <button class="nav-item" data-view="blueprint"><span>☷</span>创作规划</button>
          <button class="nav-item" data-view="editor"><span>✦</span>创作工作台</button>
          <button class="nav-item" data-view="world"><span>♧</span>设定库</button>
          <button class="nav-item" data-view="memory"><span>✦</span>记忆中枢</button>
          <button class="nav-item" data-view="plot"><span>◇</span>情节与伏笔</button>
          <button class="nav-item" data-view="story"><span>⌘</span>故事结构</button>
          <button class="nav-item" data-view="search"><span>⌕</span>全文搜索</button>
          <button class="nav-item" data-view="assistant"><span>⌕</span>写作总管</button>
          <button class="nav-item" data-view="inbox"><span>☷</span>全书待办<span id="writingInboxCount" class="task-count"></span></button>
          <button class="nav-item" data-view="consistency"><span>✓</span>一致性检查</button>
          <button class="nav-item" data-view="prompts"><span>✎</span>提示词工坊</button>
          <button class="nav-item" data-view="tasks"><span>☰</span>生成任务<span id="taskCount" class="task-count"></span></button>
          <button class="nav-item" data-view="settings"><span>⚙</span>模型与风格</button>
          <button class="nav-item" data-view="backups"><span>▣</span>备份中心</button>
          <button class="nav-item" data-view="references"><span>▥</span>旧书与参考库</button>
        </nav>
        <div class="sidebar-foot"><span class="status-dot"></span>数据保存在本机<div class="shortcut">墨屿</div></div>
      </aside>
      <main id="main" class="main"></main>
      <aside id="agentChat" class="agent-chat" aria-label="写作总管对话"></aside>
    </div>
  </div>
  <input id="fileInput" type="file" accept="application/json" hidden />
  <input id="bookFileInput" type="file" accept=".txt,.md,.markdown,.epub,text/plain,text/markdown,application/epub+zip" hidden />
  <input id="backupFileInput" type="file" accept=".zip,application/zip" hidden />
  <div id="toast" class="toast" role="status"></div>
  <script src="editor-sync.js?v=20261018-model-config-v012"></script>
  <script src="app.js?v=20261024-budget-toggle-v013"></script>
  <script src="consistency-panel.js?v=20261023-consistency-v1"></script>
  <script src="prompt-workshop.js?v=20261023-prompts-v2"></script>
  <script src="model-picker.js?v=20261018-model-config-v012"></script>
  <script src="agent-settings.js?v=20261018-model-config-v012"></script>
  <script src="author-workspace.js?v=20261024-budget-toggle-v013"></script>
  <script src="knowledge-workspace.js?v=20261018-model-config-v012"></script>
  <script src="writing-inbox.js?v=20261018-model-config-v012"></script>
  <script src="agent-chat.js?v=20261018-model-config-v012"></script>
</body>
</html>
